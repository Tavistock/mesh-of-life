<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh of Life</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
      "qrcode": "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm"
    }
  }
  </script>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div id="ui-panel">
        <div class="panel-section" data-section="mesh">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-mesh">
                    <span class="section-title">Mesh</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-mesh">
            <div class="control-row">
                <label for="primitive-select">Model:</label>
                <select id="primitive-select">
                    <option value="icosahedron">Icosahedron</option>
                    <option value="sphere">Sphere (geodesic)</option>
                    <option value="torus">Torus</option>
                    <option value="box">Box</option>
                    <optgroup label="Test models">
                        <option value="teapot">Utah Teapot</option>
                        <option value="bunny">Stanford Bunny</option>
                        <option value="suzanne">Suzanne (monkey)</option>
                        <option value="cow">Cow</option>
                    </optgroup>
                </select>
            </div>
            <div class="control-row">
                <label for="detail-slider">Detail: <span id="detail-value">128</span></label>
                <input type="range" id="detail-slider" min="0" max="8" value="7">
            </div>
            <div class="control-row">
                <button id="load-primitive">Load</button>
            </div>
            <div class="control-row file-row">
                <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.ply,.fbx" style="display:none;">
                <button id="file-btn" class="link-btn">Choose File&hellip;</button>
            </div>
            </div>
        </div>

        <div class="panel-section" data-section="simulation">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-simulation">
                    <span class="section-title">Simulation</span>
                    <span class="section-badge" id="sim-status">Paused</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-simulation">
            <div class="control-row">
                <button id="play-btn">Play</button>
                <button id="step-btn" class="secondary">Step</button>
            </div>
            <div class="control-row">
                <label for="speed-slider">Speed: <span id="speed-value">10</span> steps/s</label>
                <input type="range" id="speed-slider" min="1" max="60" value="10">
            </div>
            <div class="control-row">
                <button id="randomize-btn">Randomize</button>
                <button id="clear-btn" class="secondary">Clear</button>
            </div>
            </div>
        </div>

        <div class="panel-section" data-section="rules">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-rules">
                    <span class="section-title">Rules</span>
                    <span class="section-badge rule-display" id="rule-display">B3/S23</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-rules">
            <div class="control-row preset-row" id="preset-row">
                <label for="rule-preset">Preset:</label>
                <select id="rule-preset">
                    <option value="custom">Custom</option>
                    <option value="B3/S23">Conway's Life (B3/S23)</option>
                    <option value="B36/S23">HighLife (B36/S23)</option>
                    <option value="B3678/S34678">Day &amp; Night (B3678/S34678)</option>
                    <option value="B2/S">Seeds (B2/S)</option>
                    <option value="B3/S012345678">Life without Death (B3/S012345678)</option>
                    <option value="B3/S12345">Maze (B3/S12345)</option>
                    <option value="B35678/S5678">Diamoeba (B35678/S5678)</option>
                    <option value="B36/S125">2x2 (B36/S125)</option>
                    <option value="B1357/S1357">Replicator (B1357/S1357)</option>
                    <option value="B3/S45678">Coral (B3/S45678)</option>
                    <option value="B1/S1">Gnarl (B1/S1)</option>
                    <option value="B368/S245">Move (B368/S245)</option>
                    <option value="B357/S238">Pseudo Life (B357/S238)</option>
                    <option value="B3678/S235678">Stains (B3678/S235678)</option>
                    <option value="B5678/S45678">Vote (B5678/S45678)</option>
                    <option value="B234/S">Serviettes (B234/S)</option>
                    <option value="B567/S9ABCDEFGHI">Streptococcus (B567/S9ABCDEFGHI)</option>
                    <option value="B345/S456">Anneal (B345/S456)</option>
                    <option value="B345/S45678">Life 34 (B345/S45678)</option>
                    <option value="B345/S4567">Life 34 variant (B345/S4567)</option>
                </select>
                <div class="rule-tooltip" id="rule-tooltip"></div>
            </div>
            <div class="control-row">
                <label for="rule-hex">Hex:</label>
                <input type="text" id="rule-hex" class="rule-hex" spellcheck="false"
                       placeholder="B0x08/S0x0C">
            </div>
            <div class="rule-grid" id="rule-grid"></div>
            <div class="control-row">
                <label class="rule-radio" for="vertex-adjacency">
                    <input type="checkbox" id="vertex-adjacency" checked>
                    <span>Vertex adjacency</span>
                </label>
            </div>
            </div>
        </div>

        <div class="panel-section" data-section="brush">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-brush">
                    <span class="section-title">Brush</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-brush">
            <div class="control-row">
                <label for="brush-size">Size: <span id="brush-size-value">3</span></label>
                <input type="range" id="brush-size" min="1" max="10" value="3">
            </div>
            <div class="control-row">
                <label for="brush-density">Density: <span id="brush-density-value">50</span>%</label>
                <input type="range" id="brush-density" min="1" max="100" value="50">
            </div>
            </div>
        </div>

        <div class="panel-section" data-section="colors">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-colors">
                    <span class="section-title">Colors</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-colors">
            <div class="color-preview" id="color-preview" aria-hidden="true">
                <span class="color-preview-seg" id="preview-dead"></span>
                <span class="color-preview-seg" id="preview-alive"></span>
                <span class="color-preview-seg" id="preview-age"></span>
            </div>
            <div class="color-grid">
                <label class="color-item" for="bg-color">
                    <input type="color" id="bg-color" value="#111111">
                    <span>Background</span>
                </label>
                <label class="color-item" for="dead-color">
                    <input type="color" id="dead-color" value="#1a1a1a">
                    <span>Dead cell</span>
                </label>
                <label class="color-item" for="cell-color">
                    <input type="color" id="cell-color" value="#00ff88">
                    <span>Alive cell</span>
                </label>
                <label class="color-item" for="age-color">
                    <input type="color" id="age-color" value="#ffff00">
                    <span>Age end</span>
                </label>
            </div>
            <div class="control-row">
                <button id="randomize-colors-btn" class="secondary">Randomize Colors</button>
            </div>
            </div>
        </div>

        <div class="panel-section" data-section="info">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-info">
                    <span class="section-title">Info</span>
                    <span class="section-badge"><span id="fps-count">0</span> FPS</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-info">
            <div class="stat-grid">
                <div class="stat-item">
                    <span class="stat-label">Avg neighbors</span>
                    <span class="stat-value" id="avg-neighbors">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Max neighbors</span>
                    <span class="stat-value" id="max-neighbors">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Cells</span>
                    <span class="stat-value" id="face-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Alive</span>
                    <span class="stat-value" id="alive-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Gen</span>
                    <span class="stat-value" id="gen-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Engine</span>
                    <span class="stat-value" id="engine-mode">GPU</span>
                </div>
            </div>
            </div>
        </div>

        <div class="panel-section" data-section="decals">
            <h3 class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-decals">
                    <span class="section-title">Decals</span>
                    <span class="section-chevron" aria-hidden="true"></span>
                </button>
            </h3>
            <div class="section-body" id="section-decals">
            <div class="subsection-label">Image</div>
            <div class="control-row">
                <input type="file" id="image-input" accept="image/*" style="display:none;">
                <button id="image-btn" class="secondary">Upload Image</button>
            </div>
            <div class="subsection-label">QR code</div>
            <div class="control-row">
                <label for="qr-text">Text / URL:</label>
                <input type="text" id="qr-text" placeholder="(blank = current URL)" spellcheck="false">
            </div>
            <div class="control-row">
                <button id="qr-generate" class="secondary">Generate QR</button>
                <button id="qr-current" class="secondary">Use Current URL</button>
            </div>
            <div class="image-preview-wrap">
                <canvas id="image-preview" width="248" height="248"></canvas>
                <div class="image-preview-hint" id="image-preview-hint">Choose an image to preview</div>
            </div>
            <div class="subsection-label">Placement</div>
            <div class="control-row">
                <label for="image-projection">Projection:</label>
                <select id="image-projection">
                    <option value="spherical">Spherical (wrap)</option>
                    <option value="front">Front (planar)</option>
                    <option value="side">Side (planar)</option>
                    <option value="top">Top (planar)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="image-scale">Scale: <span id="image-scale-value">100</span>%</label>
                <input type="range" id="image-scale" min="10" max="400" value="100">
            </div>
            <div class="control-row">
                <label for="image-rotation">Rotate: <span id="image-rotation-value">0</span>&deg;</label>
                <input type="range" id="image-rotation" min="-180" max="180" value="0">
            </div>
            <div class="control-row">
                <label for="image-offset-x">X: <span id="image-offset-x-value">0</span></label>
                <input type="range" id="image-offset-x" min="-100" max="100" value="0">
            </div>
            <div class="control-row">
                <label for="image-offset-y">Y: <span id="image-offset-y-value">0</span></label>
                <input type="range" id="image-offset-y" min="-100" max="100" value="0">
            </div>
            <div class="control-row">
                <button id="image-reset" class="secondary">Reset Transform</button>
            </div>
            <div class="control-row">
                <label for="image-threshold">Threshold: <span id="image-threshold-value">50</span>%</label>
                <input type="range" id="image-threshold" min="1" max="100" value="50">
            </div>
            <div class="control-row">
                <label class="rule-radio" for="image-invert">
                    <input type="checkbox" id="image-invert">
                    <span>Invert (dark = alive)</span>
                </label>
            </div>
            <div class="control-row">
                <label class="rule-radio" for="image-live">
                    <input type="checkbox" id="image-live">
                    <span>Live preview on mesh</span>
                </label>
            </div>
            <div class="control-row">
                <button id="image-apply" class="secondary" disabled>Apply to Mesh</button>
            </div>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="hidden" aria-hidden="true">
        <div class="loading-spinner"></div>
        <div class="loading-label" id="loading-label">Loading&hellip;</div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
